# /usr/share/topology/nginx/topology.conf -- include this in a server { } block:
#     include /usr/share/topology/nginx/topology.conf;
# It serves the front door and app, the downloads, and the graph API.
root /usr/share/topology/www;
index index.html;
location /dist/ { alias /var/lib/topology/dist/; autoindex on; }
location /api/  { proxy_pass http://127.0.0.1:8740; proxy_set_header Host $host; }
location ~ \.(org|md)$ { default_type text/plain; charset utf-8; }
